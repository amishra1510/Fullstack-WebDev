<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bold italics and underline</title>
  </head>
  <body>
    <p>
      I am a good
      <u
        ><b
          ><i><s>Boy</s></i></b
        ></u
      >
    </p>
    <!-- s for strikethrough -->
    <p>H<sub>2</sub>O</p>
    <!-- for adding subscript and superscript -->
    <p>2<sup>n</sup></p>
  </body>
</html>
