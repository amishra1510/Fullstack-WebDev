<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <h1>Lists</h1>
    <ul>
      <li>Apples</li>
      <li>Bananas</li>
      <li>Oranges</li>
    </ul>
    <!-- unordered list -->
    <br />
    <ol>
      <li>Wake up</li>
      <li>Brush your teeth</li>
      <li>Go to work</li>
    </ol>
    <!--ordered list-->
    <br />
    <dl>
      <dt>HTML</dt>
      <dd>A markup language for making webpages</dd>
      <dt>CSS</dt>
      <dd>Used for styling HTML pages</dd>
    </dl>

    <!--Decription list description term description description-->
    <br />

    <!--Nested lists-->
    <ul>
      <li>
        Fruits
        <ul>
          <li>Apples</li>
          <li>Mangoes</li>
        </ul>
      </li>
      <li>Vegetables</li>
    </ul>
  </body>
</html>
